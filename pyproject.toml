[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-dynamo-routing-lab"
version = "0.1.0"
description = "Reproducible simulator of KV-cache-aware inference request routing tradeoffs"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["dynamo_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
